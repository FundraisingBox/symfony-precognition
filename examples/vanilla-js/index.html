<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Symfony Precognition — vanilla JS example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; font-weight: 600; margin-top: 1rem; }
      input { padding: 0.5rem; font-size: 1rem; width: 100%; box-sizing: border-box; }
      .error { display: block; color: #b00020; font-size: 0.85rem; min-height: 1rem; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
      #status { color: #04724d; }
    </style>
  </head>
  <body>
    <h1>Create user</h1>

    <!-- Input names match UserDto's property paths (firstName, lastName, age);
         each error slot is keyed by the same path. -->
    <form id="user">
      <label for="firstName">First name</label>
      <input id="firstName" name="firstName" />
      <span class="error" data-error-for="firstName"></span>

      <label for="lastName">Last name</label>
      <input id="lastName" name="lastName" />
      <span class="error" data-error-for="lastName"></span>

      <label for="age">Age</label>
      <input id="age" name="age" type="number" />
      <span class="error" data-error-for="age"></span>

      <button type="submit">Create user</button>
      <p id="status"></p>
    </form>

    <script type="module" src="./precognition.js"></script>
  </body>
</html>
