<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Symfony Precognition — vanilla JS example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
      .field { margin-bottom: 1rem; display: flex; flex-direction: column; }
      label { font-weight: 600; margin-bottom: 0.25rem; }
      input { padding: 0.5rem; font-size: 1rem; }
      .error { color: #b00020; font-size: 0.85rem; min-height: 1rem; margin-top: 0.25rem; }
      button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
      .ok { color: #04724d; }
    </style>
  </head>
  <body>
    <h1>Create user</h1>

    <!-- Each input carries the DTO property path it maps to; the error slot is
         keyed by the same path so violations can be rendered next to it. -->
    <form id="user">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" data-field="firstName" />
        <span class="error" data-error-for="firstName"></span>
      </div>

      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" data-field="lastName" />
        <span class="error" data-error-for="lastName"></span>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input id="age" name="age" data-field="age" inputmode="numeric" />
        <span class="error" data-error-for="age"></span>
      </div>

      <button type="submit">Create user</button>
      <p class="ok" id="status"></p>
    </form>

    <script type="module" src="./precognition.js"></script>
  </body>
</html>
